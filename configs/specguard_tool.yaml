# Native-tool SWE-bench Lean run. Uses the same task preparation, Lean checks,
# and evaluator as swebench-lean, but the three agents act through API tools.
# uv run specguard_tool --config configs/specguard_tool.yaml --limit 5

provider: openai_compatible
model: openai/gpt-5.6-sol
api_key_env: OPENROUTER_API_KEY
api_base_env: OPENROUTER_BASE_URL
# For the direct OpenAI endpoint instead, uncomment these and comment above:
# model: gpt-5.6-sol
# api_key_env: OPENAI_API_KEY
# api_base_env: ""
max_tokens: 16000
# effort: medium

split: oneoff                  # oneoff | original | conflicting
all: true
limit: 0                      # 0 = full split
# ids:
#   - astropy__astropy-12907

spec_turns: 120
spec_submissions: 10
exec_timeout: 120
test_submissions: 10
connector_submissions: 6
test_order_seed: 0

workers: 50
repl_processes: 5
lean_timeout: 120

# USD per million tokens. Estimates only; update to your billed provider rates.
input_price: 4.0
cached_input_price: 0.4
cache_write_input_price: 5.0
output_price: 20.0
